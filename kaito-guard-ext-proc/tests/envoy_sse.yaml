static_resources:
  listeners:
    - name: sse
      address:
        socket_address: {address: 127.0.0.1, port_value: $LISTENER_PORT}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: sse
                route_config:
                  name: upstream
                  virtual_hosts:
                    - name: upstream
                      domains: ["*"]
                      routes:
                        - match: {prefix: /}
                          route: {cluster: upstream, timeout: 0s}
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: {cluster_name: processor}
                        timeout: 5s
                      message_timeout: 5s
                      failure_mode_allow: false
                      allow_mode_override: false
                      processing_mode:
                        request_header_mode: SKIP
                        request_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_header_mode: SEND
                        response_body_mode: STREAMED
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: upstream
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: $UPSTREAM_PORT}
    - name: processor
      type: STATIC
      connect_timeout: 1s
      http2_protocol_options: {}
      load_assignment:
        cluster_name: processor
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: $PROCESSOR_PORT}
