services:
  processor:
    image: kaito-guard-ext-proc:local
    build:
      context: ../../..
      dockerfile: docker/Dockerfile.kaito-guard-ext-proc
    command: [python, -m, ext_proc.server, --policy, /config/policy.json,
              --response-body-mode, "${BODY_MODE:-BUFFERED}"]
    volumes:
      - type: bind
        source: ${POLICY_FILE:-./policy.json}
        target: /config/policy.json
        read_only: true
        bind: {create_host_path: false}
  upstream:
    image: python:3.12-slim
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command:
      - python
      - -c
      - |
        from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
        SimpleHTTPRequestHandler.extensions_map[".sse"] = "text/event-stream"
        ThreadingHTTPServer(("0.0.0.0", 8000), SimpleHTTPRequestHandler).serve_forever()
  envoy:
    image: envoyproxy/envoy:v1.36.11
    depends_on: [processor, upstream]
    ports: ["127.0.0.1:18080:8080"]
    configs:
      - source: envoy
        target: /etc/envoy/envoy.yaml

configs:
  envoy:
    content: |
      static_resources:
        listeners:
          - name: guardrail
            address:
              socket_address: {address: 0.0.0.0, port_value: 8080}
            filter_chains:
              - filters:
                  - name: envoy.filters.network.http_connection_manager
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                      stat_prefix: guardrail
                      route_config:
                        name: local
                        virtual_hosts:
                          - name: fixtures
                            domains: ["*"]
                            routes:
                              - match: {prefix: /}
                                route: {cluster: upstream}
                      http_filters:
                        - name: envoy.filters.http.ext_proc
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                            grpc_service:
                              envoy_grpc: {cluster_name: processor}
                            message_timeout: 5s
                            failure_mode_allow: false
                            allow_mode_override: false
                            processing_mode:
                              request_header_mode: SKIP
                              request_body_mode: NONE
                              request_trailer_mode: SKIP
                              response_header_mode: SEND
                              response_body_mode: ${BODY_MODE:-BUFFERED}
                              response_trailer_mode: SKIP
                        - name: envoy.filters.http.router
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        clusters:
          - name: upstream
            type: STRICT_DNS
            connect_timeout: 2s
            load_assignment:
              cluster_name: upstream
              endpoints:
                - lb_endpoints:
                    - endpoint:
                        address:
                          socket_address: {address: upstream, port_value: 8000}
          - name: processor
            type: STRICT_DNS
            connect_timeout: 2s
            http2_protocol_options: {}
            load_assignment:
              cluster_name: processor
              endpoints:
                - lb_endpoints:
                    - endpoint:
                        address:
                          socket_address: {address: processor, port_value: 9000}
