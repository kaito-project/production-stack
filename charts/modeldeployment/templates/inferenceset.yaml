{{- if .Values.enableScaling }}
{{- if lt ((.Values.maxReplicas | int)) ((.Values.replicas | int)) }}
{{- fail (printf "modeldeployment: maxReplicas (%d) must be >= replicas (%d) when enableScaling is true" (.Values.maxReplicas | int) (.Values.replicas | int)) }}
{{- end }}
{{- if not (.Values.scaling).metrics }}
{{- fail "modeldeployment: scaling.metrics must contain at least one entry when enableScaling is true" }}
{{- end }}
{{- end }}
apiVersion: kaito.sh/v1alpha1
kind: InferenceSet
metadata:
  name: {{ include "modeldeployment.name" . }}
  namespace: {{ include "modeldeployment.namespace" . }}
  labels:
    {{- include "modeldeployment.labels" . | nindent 4 }}
  {{- if .Values.enableScaling }}
  annotations:
    scaledobject.kaito.sh/auto-provision: "true"
    scaledobject.kaito.sh/min-replicas: {{ .Values.replicas | quote }}
    scaledobject.kaito.sh/max-replicas: {{ .Values.maxReplicas | quote }}
    {{- $lines := list }}
    {{- range $i, $m := .Values.scaling.metrics }}
    {{- if not $m.name }}
    {{- fail (printf "modeldeployment: scaling.metrics[%d].name is required when enableScaling is true" $i) }}
    {{- end }}
    {{- $hasUp := and (hasKey $m "upThreshold") (ne (toString $m.upThreshold) "") }}
    {{- $hasDown := and (hasKey $m "downThreshold") (ne (toString $m.downThreshold) "") }}
    {{- if ne $hasUp $hasDown }}
    {{- fail (printf "modeldeployment: scaling.metrics[%d] must supply both upThreshold and downThreshold" $i) }}
    {{- end }}
    {{- $hasActivation := and (hasKey $m "activationThreshold") (ne (toString $m.activationThreshold) "") }}
    {{- $hasDeactivation := and (hasKey $m "deactivationThreshold") (ne (toString $m.deactivationThreshold) "") }}
    {{- if and (gt ($.Values.replicas | int) 0) (not $hasUp) (not $hasActivation) }}
    {{- fail (printf "modeldeployment: scaling.metrics[%d] requires upThreshold/downThreshold or activationThreshold when replicas is greater than zero" $i) }}
    {{- end }}
    {{- if and $hasUp (not (gt (subf $m.upThreshold $m.downThreshold) 0.0)) }}
    {{- fail (printf "modeldeployment: scaling.metrics[%d].upThreshold (%v) must be greater than downThreshold (%v) when enableScaling is true" $i $m.upThreshold $m.downThreshold) }}
    {{- end }}
    {{- if and $hasActivation (not $hasDeactivation) }}
    {{- fail (printf "modeldeployment: scaling.metrics[%d].activationThreshold requires deactivationThreshold" $i) }}
    {{- end }}
    {{- if and $hasActivation (ne $m.source "epp") }}
    {{- fail (printf "modeldeployment: scaling.metrics[%d].activationThreshold requires source=epp" $i) }}
    {{- end }}
    {{- $type := default "gauge" $m.type }}
    {{- $lines = append $lines (printf "- name: %s" ($m.name | quote)) }}
    {{- $lines = append $lines (printf "  type: %s" ($type | quote)) }}
    {{- with $m.source }}
    {{- $lines = append $lines (printf "  source: %s" (. | quote)) }}
    {{- end }}
    {{- if $hasUp }}
    {{- $lines = append $lines (printf "  upthreshold: %v" $m.upThreshold) }}
    {{- $lines = append $lines (printf "  downthreshold: %v" $m.downThreshold) }}
    {{- end }}
    {{- if $hasActivation }}
    {{- $lines = append $lines (printf "  activationthreshold: %v" $m.activationThreshold) }}
    {{- end }}
    {{- if $hasDeactivation }}
    {{- $lines = append $lines (printf "  deactivationthreshold: %v" $m.deactivationThreshold) }}
    {{- end }}
    {{- if and (eq $type "histogram") $m.metricCacheWindow }}
    {{- $lines = append $lines (printf "  metriccachewindow: %v" $m.metricCacheWindow) }}
    {{- end }}
    {{- end }}
    scaledobject.kaito.sh/metrics: |-
      {{- (join "\n" $lines) | nindent 6 }}
    {{- with (.Values.scaling).evaluationWindow }}
    scaledobject.kaito.sh/evaluationwindow: {{ . | quote }}
    {{- end }}
    {{- with (.Values.scaling).scaleUpCooldown }}
    scaledobject.kaito.sh/scaleupcooldown: {{ . | quote }}
    {{- end }}
    {{- with (.Values.scaling).scaleDownCooldown }}
    scaledobject.kaito.sh/scaledowncooldown: {{ . | quote }}
    {{- end }}
    {{- with (.Values.scaling).cooldownPeriod }}
    scaledobject.kaito.sh/cooldownperiod: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- /*
  When scaling is enabled, KEDA owns the live replica count: keda-kaito-scaler
  drives it through the InferenceSet's scale subresource, whose specpath is
  .spec.replicas, so the chart leaves that field unset. The lower bound reaches
  KEDA through the scaledobject.kaito.sh/min-replicas annotation above.
  */}}
  {{- if not .Values.enableScaling }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  labelSelector:
    matchLabels:
      apps: {{ include "modeldeployment.name" . }}
  template:
    metadata:
      labels:
        {{/*
        Stamp the production-stack ownership label into the InferenceSet
        template metadata. The upstream KAITO InferenceSet controller
        clones template.metadata.labels onto every child Workspace it
        renders, which in turn propagates the label onto the inference
        workload pods. The modelharness NetworkPolicies positively select
        on this label — without it, KAITO-rendered inference pods would
        not match `default-deny-ingress` / `allow-inference-traffic` and
        cross-namespace ingress to them would silently succeed.
        */}}
        {{- include "modeldeployment.ownerLabel" . | nindent 8 }}
      {{/*
      Streaming annotations are stamped here on spec.template.metadata.annotations
      */}}
      {{- $disabled := eq (.Values.streaming.disabled | toString) "true" }}
      {{- $sas := eq (.Values.streaming.staticModelMirror | toString) "true" }}
      {{- if and $disabled $sas }}
      {{- fail "modeldeployment: streaming.disabled and streaming.staticModelMirror are mutually exclusive" }}
      {{- end }}
      {{- if or (not .Values.enableBenchmark) .Values.performanceMode $disabled $sas }}
      annotations:
        {{- if not .Values.enableBenchmark }}
        kaito.sh/disable-benchmark: "true"
        {{- end }}
        {{- with .Values.performanceMode }}
        kaito.sh/performance-mode: {{ . | quote }}
        {{- end }}
        {{- if $disabled }}
        kaito.sh/model-streaming: "disabled"
        {{- end }}
        {{- if $sas }}
        inference.kaito.sh/static-model-mirror: "true"
        inference.kaito.sh/stream-datarefs-url: {{ .Values.streaming.datarefsUrl | quote }}
        inference.kaito.sh/stream-identity-client-id: {{ .Values.streaming.identityClientId | quote }}
        inference.kaito.sh/stream-source-type: {{ .Values.streaming.sourceType | quote }}
        {{- end }}
      {{- end }}
    resource:
      instanceType: {{ .Values.instanceType | quote }}
    inference:
      preset:
        name: {{ .Values.model | quote }}
        {{- if .Values.modelAccessSecret }}
        presetOptions:
          modelAccessSecret: {{ .Values.modelAccessSecret | quote }}
        {{- end }}
      {{- with .Values.config }}
      config: {{ . | quote }}
      {{- end }}
  {{- if (.Values.autoUpgrade).enabled }}
  autoUpgrade:
    enabled: true
    {{- with (.Values.autoUpgrade).maintenanceWindow }}
    {{- if .schedule }}
    maintenanceWindow:
      schedule: {{ .schedule | quote }}
      {{- with .duration }}
      duration: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
