apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "modeldeployment.eppName" . }}
  namespace: {{ include "modeldeployment.namespace" . }}
  labels:
    {{- include "modeldeployment.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "modeldeployment.eppName" . }}
  namespace: {{ include "modeldeployment.namespace" . }}
  labels:
    {{- include "modeldeployment.labels" . | nindent 4 }}
rules:
  {{- /*
  The EPP watches InferenceObjective (llm-d.ai/v1, else llm-d.ai/v1alpha2)
  and InferenceModelRewrite (llm-d.ai/v1alpha2) only when the cluster serves
  their CRDs. If it cannot list and watch a served one, its cache never syncs
  and it restarts.
  */}}
  - apiGroups: ["llm-d.ai"]
    resources: ["inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "modeldeployment.eppName" . }}
  namespace: {{ include "modeldeployment.namespace" . }}
  labels:
    {{- include "modeldeployment.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "modeldeployment.eppName" . }}
    namespace: {{ include "modeldeployment.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "modeldeployment.eppName" . }}
