# Required inputs.

# name is the deployment name, used as the InferenceSet name, the object-name prefix and the `model` value
# routed by the HTTPRoute; defaults to .Release.Name.
name: ""

# namespace is the target namespace; defaults to .Release.Namespace.
namespace: ""

# model is the KAITO inference preset name (required); several deployments may share one preset.
model: ""

# config names a ConfigMap with custom inference arguments (spec.template.inference.config).
config: ""

# modelAccessSecret names the Secret holding the Hugging Face access credentials.
modelAccessSecret: ""

# instanceType is the VM instance type of the GPU nodes; "" omits it. Required with node auto-provisioning;
# optional on BYO-node clusters, where it restricts GPU nodes to node.kubernetes.io/instance-type=<instanceType>.
instanceType: "Standard_NV36ads_A10_v5"

# nodeLabelSelector is a LabelSelector (matchLabels / matchExpressions) for the GPU nodes, rendered as
# spec.template.resource.labelSelector; empty omits it. With node auto-provisioning an empty value inherits the
# InferenceSet spec.labelSelector; on BYO-node clusters GPU nodes are auto-selected. Requires a KAITO release with
# kaito-project/kaito#2444 (v0.13.0+); older CRDs silently drop it.
nodeLabelSelector: {}

# replicas sets spec.replicas when not empty (otherwise the CRD default of 1); with enableScaling it must lie
# within [minReplicas, maxReplicas] and is reapplied on upgrade only when its value changes.
replicas: ""

# enableScaling turns on KEDA autoscaling via keda-kaito-scaler; when false, minReplicas, maxReplicas and
# `scaling` are ignored.
enableScaling: false

# minReplicas is the autoscaling lower bound (required with enableScaling); 0 enables scale to zero
# (keda-kaito-scaler v0.7.0+), see the chart README.
minReplicas: ""

# maxReplicas is the autoscaling upper bound (required with enableScaling); must be >= 1, >= minReplicas and
# >= replicas.
maxReplicas: ""

# scaling configures keda-kaito-scaler (only with enableScaling): 1 <-> N scales up when EVERY metric is above
# its upThreshold and down when EVERY metric is below its downThreshold; 0 <-> 1 (only with minReplicas=0)
# wakes when ANY metric is above its activationThreshold and parks when EVERY metric with a
# deactivationThreshold is at or below it for cooldownPeriod.
scaling:
  # metrics is the ordered list of scaling signals, rendered as the scaledobject.kaito.sh/metrics annotation.
  metrics:
      # name is the Prometheus metric name.
    - name: "vllm:num_requests_waiting"
      # type is `gauge` (per-replica average, summed across EPP pods) or `histogram` (per-pod windowed average).
      type: "gauge"
      # source is `modelpod` (vLLM pods, the default) or `epp` (Endpoint Picker pods, observable at zero replicas).
      source: ""
      # aggregation overrides the reduction: `sum` or `service-avg` (gauge), `windowed-avg` (histogram).
      aggregation: ""
      # upThreshold is the per-replica scale-up threshold; must be greater than downThreshold.
      upThreshold: "10"
      # downThreshold is the per-replica scale-down threshold.
      downThreshold: "1"
      # activationThreshold wakes a parked deployment when exceeded; requires `source: epp` and a
      # deactivationThreshold.
      activationThreshold: ""
      # deactivationThreshold lets the deployment park once the metric is at or below it; must not exceed
      # activationThreshold.
      deactivationThreshold: "0"
      # metricCacheWindow is the averaging window in seconds for histogram metrics (empty: 300).
      metricCacheWindow: ""
      # Request queue time, combined with the metric above for 1 <-> N.
    - name: "vllm:request_queue_time_seconds"
      type: "histogram"
      upThreshold: "30"
      downThreshold: "1"
      metricCacheWindow: "300"
      # Requests held by the EPP while parked; 0 wakes on the first request (raising it to T needs roughly
      # QPS > T / defaultRequestTTL to wake, see the chart README).
    - name: "llm_d_epp_flow_control_queue_size"
      type: "gauge"
      source: "epp"
      activationThreshold: "0"
      deactivationThreshold: "0"
      # Park only once the model server has no running request.
    - name: "vllm:num_requests_running"
      type: "gauge"
      deactivationThreshold: "0"

  # hpa sets the HPA behavior for 1 <-> N scaling (each step adds or removes one replica); empty uses the
  # keda-kaito-scaler defaults, which equal the values below.
  hpa:
    scaleUp:
      # stabilizationWindowSeconds is the scale-up stabilization window (0..3600s).
      stabilizationWindowSeconds: 60
      # periodSeconds is the minimum interval between scale-up steps (1..1800s).
      periodSeconds: 900
      # tolerance is the scale-up deadband, 0 <= tolerance < 1 (needs the HPAConfigurableTolerance feature gate).
      tolerance: 0.1
    scaleDown:
      # stabilizationWindowSeconds is the scale-down stabilization window (0..3600s).
      stabilizationWindowSeconds: 1800
      # periodSeconds is the minimum interval between scale-down steps (1..1800s).
      periodSeconds: 1800
      # tolerance is the scale-down deadband, 0 <= tolerance < 0.5 (needs the HPAConfigurableTolerance feature
      # gate).
      tolerance: 0.1
  # initialCooldownPeriod delays the first park after the ScaledObject is created (seconds, minReplicas=0 only).
  initialCooldownPeriod: 1800
  # cooldownPeriod is how long the deployment must stay idle before it parks (seconds, minReplicas=0 only).
  cooldownPeriod: 1800

# enableBenchmark runs KAITO benchmarks for this InferenceSet; false sets `kaito.sh/disable-benchmark: "true"`.
enableBenchmark: true

# performanceMode selects the KAITO performance profile: "balanced" (the default when empty), "interactivity" or
# "throughput".
performanceMode: ""

# streaming configures KAITO model streaming, stamped as annotations on every Workspace.
streaming:
  # disabled set to "true" turns model streaming off; mutually exclusive with staticModelMirror.
  disabled: ""
  # staticModelMirror set to "true" streams the model directly via SAS; requires the three fields below.
  staticModelMirror: ""
  # datarefsUrl is the SAS-mint endpoint URL.
  datarefsUrl: ""
  # identityClientId is the UAMI client ID; must match the modelharness workloadIdentityClientId.
  identityClientId: ""
  # sourceType is "public" or "byo".
  sourceType: ""

# autoUpgrade rolls replicas onto a newer KAITO base image one at a time (also requires the KAITO
# `enableBaseImageAutoUpgrade` feature gate).
autoUpgrade:
  # enabled turns base image auto-upgrade on.
  enabled: false
  # maintenanceWindow restricts when upgrades may start; empty allows any time.
  maintenanceWindow:
    # schedule is a 5-field UTC cron expression marking each window's start, e.g. "0 2 * * 6".
    schedule: ""
    # duration is how long each window stays open (empty: 4h).
    duration: ""

# gatewayName is the Gateway the HTTPRoute attaches to; empty uses the namespace's modelharness Gateway.
gatewayName: ""

# Endpoint Picker (EPP), inlining the InferencePool + EPP that KAITO would otherwise install via Flux.
epp:
  image:
    repository: "mcr.microsoft.com/oss/v2/llm-d/llm-d-router-endpoint-picker"
    tag: "v0.9.0"
    pullPolicy: "IfNotPresent"
  replicas: 1
  # modelServerPort must match KAITO's inference server port.
  modelServerPort: 5000
  # extProcPort is the gRPC ext_proc port used by the Gateway.
  extProcPort: 9002
  # healthPort is the gRPC health-check port.
  healthPort: 9003
  # metricsPort is the HTTP metrics port.
  metricsPort: 9090
  # logVerbosity is passed as `--v=<n>`.
  logVerbosity: 1
  # scorerWeights trades off load distribution against prefix-cache affinity.
  scorerWeights:
    queue: 2
    kvCacheUtilization: 2
    prefixCache: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # tolerations are applied to the EPP pod.
  tolerations: []
  # flowControl queues requests in the EPP while no replica exists; it is on automatically with minReplicas=0.
  flowControl:
    # enabled forces flow control on without scale to zero.
    enabled: false
    # maxConcurrency is the per-endpoint in-flight capacity; the large default queues only while no replica exists.
    maxConcurrency: 1000000
    # maxBytes caps the queued request bodies (beyond it requests get 429); empty uses the EPP's 1GB per band.
    maxBytes: "128Mi"
    # defaultRequestTTL is how long a request may wait in the queue before it fails; empty waits for the client.
    defaultRequestTTL: "600s"
  # modelServerSelector selects the inference pods (the pod-index 0 leader) of this InferenceSet.
  modelServerSelector:
    inferenceset.kaito.sh/created-by: ""   # auto-filled with .Values.name when empty
    apps.kubernetes.io/pod-index: "0"

# cloudprovider selects the HTTPRoute variant: "" (header-only routing) or "azure" (adds the default-domain
# hostname).
cloudprovider: ""

# azure holds the values used only when cloudprovider=azure.
azure:
  # defaultDomain attaches the HTTPRoute to the modelharness Gateway's default-domain HTTPS listener.
  defaultDomain:
    # zoneName is the AKS default-domain zone (required with azure; must match the modelharness release), see
    # `az aks show --query ingressProfile.webAppRouting.defaultDomain.domainName`.
    zoneName: ""
