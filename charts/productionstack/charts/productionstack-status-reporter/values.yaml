# ─────────────────────────────────────────────────────────────────────────────
# productionstack-status-reporter — values.
#
# The reporter is a single, leader-elected, READ-ONLY controller that
# evaluates the control-plane reason catalogue and emits aggregated
# Kubernetes Events in kube-system. Run it HA (>= 2 replicas); only the
# leader emits events.
# ─────────────────────────────────────────────────────────────────────────────

# Inherit the umbrella release namespace by default. Set to install the
# reporter into its own namespace (which must already exist).
namespaceOverride: ""

image:
  repository: mcr.microsoft.com/oss/v2/kaito/productionstack-status-reporter
  tag: v0.5.0
  pullPolicy: IfNotPresent

# Run HA so a node drain never blanks the status stream. Only the elected
# leader emits events, so replicas never duplicate the event stream.
replicas: 2

# How often every reason is re-evaluated.
resyncSeconds: 60

# Minimum interval (seconds) between two writes of the same active Event. While
# a problem persists its Event is refreshed this often so it never ages out with
# the kube-apiserver Event TTL (default 1h); must be below 1800. No recovery
# Event is emitted: once the problem clears, the Event simply stops refreshing.
eventRefreshSeconds: 300

# Window (seconds) during which transient startup states are not surfaced as
# Warning events: findings are withheld while the backing resource is younger
# than this window (or, for findings without a backing object, until the
# problem has persisted this long). Some reasons use their own window, and
# terminal KAITO failures bypass it. Set to 0 to disable.
startupGraceSeconds: 60

leaderElection:
  enabled: true
  id: productionstack-status-reporter

# modelsAPI serves the OpenAI-compatible model discovery endpoints
# (`GET /v1/models` and `GET /v1/models/{id}`) for every modelharness-managed
# workload namespace, aggregating the InferenceSets registered in the caller's
# own namespace. It is a registry view, not a health check: a model is listed as
# soon as its InferenceSet exists, regardless of whether it is serving yet.
#
# Unlike the event-emitting reporter loop, this endpoint runs on EVERY replica
# (it opts out of leader election) because it sits behind a Service.
#
# The Service name is pinned (`productionstack-status-reporter`) because
# charts/modelharness is a separate release that targets it by cluster FQDN.
# Only the port is tunable here; change it and you must set the matching
# modelharness `modelsAPI.servicePort`. Likewise this chart's install namespace
# must match modelharness `modelsAPI.serviceNamespace` (both default to
# kube-system).
modelsAPI:
  port: 8082

# Install namespaces of the cluster-layer components the reporter probes.
# These default to the umbrella chart's own defaults; override to match a
# customised install.
controlPlane:
  istioNamespace: istio-system
  kaitoNamespace: kaito-workspace
  kedaNamespace: keda
  gatewayAuthNamespace: llm-gateway-auth
  bbrNamespace: kaito-system
  kedaScalerNamespace: keda
  # Deployment names probed for cluster-layer readiness. Override to match a
  # customised install (e.g. a revisioned istiod on the AKS Istio add-on).
  istiodDeployment: istiod
  kaitoDeployment: kaito-workspace
  bbrDeployment: body-based-router
  kedaScalerDeployment: keda-kaito-scaler
  # apikey-authz ext_authz backend and the apikey-operator that reconciles
  # APIKey CRs, present only for apikey/hybrid auth. Set to "" on a pure-azure
  # cluster so their absence is not flagged.
  gatewayAuthDeployment: apikey-authz
  gatewayAuthOperatorDeployment: apikey-operator
  # Optional azure-authz ext_authz backend (subchart llm-gateway-azureauth),
  # installed for both azure and hybrid auth. It shares the
  # clusterGatewayAuthNotReady reason with apikey-authz. Leave name empty on a
  # pure-apikey cluster to skip the check.
  azureAuthz:
    name: ""
    namespace: ""
  # Local CSI driver installed by the KAITO workspace chart, probed for
  # clusterLocalCSIDriverNotReady. Set namespace to "" to disable the check, or
  # clear one name to skip that half of it.
  localCSIDriver:
    namespace: kube-system
    managerDeployment: csi-local-manager
    nodeDaemonSet: csi-local-node
  # Sliding-window evaluation for inferencesetModelDownloadSlow.
  weightDownload:
    windowSeconds: 60
    minMBps: 20
    # Download-speed gauge and port of the vLLM model pod (self-download path).
    metricName: kaito_model_download_speed_bytes_per_second
    metricPort: 5000
    # MUST match KAITO's ModelStreaming feature gate: when true, InferenceSets
    # that do not opt out of streaming are observed through their ModelMirror.
    modelStreamingEnabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Soft anti-affinity so HA replicas prefer separate nodes.
podAntiAffinity: true

nodeSelector: {}
tolerations: []
affinity: {}
