apiVersion: v2
name: modelharness
description: |
  Per-namespace shared resources for production-stack workloads. One
  modelharness release per workload namespace provisions the artifacts
  every model deployment in that namespace shares: the Gateway,
  routing and error-handling EnvoyFilters, network policies, and — when
  enabled — API-key authentication resources. The APIKey CR triggers
  the operator to mint the per-namespace `llm-api-key` Secret.
type: application
version: 0.4.0
appVersion: "0.4.0"
