{{/*
Per-namespace Body-Based Router (BBR) wiring.

BBR runs as a cluster-wide singleton (one Deployment + Service installed by
charts/productionstack/charts/body-based-routing in `bbr.namespace`). This
template renders the dataplane half: the ext_proc EnvoyFilter that injects
BBR into this namespace's Gateway HCM, scoped to that Gateway pod via
`workloadSelector`.

Filter-chain placement:
  BBR injects `X-Gateway-Model-Name` from the JSON request body so the
  per-Gateway HTTPRoute and the InferencePool ext_proc filter (EPP) can
  route to the correct deployment. BBR MUST run BEFORE the InferencePool
  ext_proc filter: if ext_proc ran first it would resolve its per-route
  override before the header exists, fall through to the catch-all, and
  round-robin across the InferencePool pods (bypassing EPP).

  BBR is NOT anchored on that ext_proc filter. Istio adds it only to a
  Gateway that has an InferencePool attached, and an INSERT_BEFORE whose
  anchor is missing is dropped without an error, so a namespace without a
  modeldeployment would run without BBR and answer a request that names a
  model with 400 invalid_request_body instead of 404 model_not_found.
  Instead BBR goes directly after the last ext_authz filter the auth
  EnvoyFilters render (see modelharness.bbrAnchorFilter), or first when
  auth renders none. Istio appends the InferencePool ext_proc after its own
  authn/authz filters, giving the chain:
    kaito.cors -> [ext_authz] -> kaito.strip-routing-headers -> bbr -> ... -> ext_proc (InferencePool) -> ... -> router
  BBR therefore still runs after authentication, so an unauthenticated
  request never reaches it. `priority: 5` applies this patch after the auth
  EnvoyFilters (priority 0) that create the anchor and before gateway-cors
  (priority 10), whose INSERT_FIRST keeps kaito.cors ahead of BBR.

Client-supplied routing headers:
  BBR writes `X-Gateway-Model-Name` and `X-Gateway-Base-Model-Name` only
  when the request body names a `model`. On a request without one, or
  without a body, a value the client set itself would survive, and the
  modeldeployment HTTPRoute routes on either header. The EPP sends a
  bodyless request to a random pod, so a client could reach any
  model-server endpoint that takes no body (e.g. `/metrics`), and the
  outage local_reply (envoyfilter-outage-reply.yaml) reads a present model
  header as "BBR ran". `kaito.strip-routing-headers`, a Lua filter inserted
  immediately before BBR, removes both headers so only BBR sets them. It is
  anchored on BBR itself, so it follows BBR wherever the placement above
  puts it; it must never run after BBR, which would delete BBR's own
  headers. Envoy picks the route before the filter chain runs; a Lua filter
  that modifies the request headers drops that cached route (the Lua
  filter's `clear_route_cache`, on by default), so the request is routed as
  if the client had never sent the header.

Transport:
  BBR serves plaintext HTTP/2; the upstream cluster is plain
  `outbound|<port>||<svc>` with no upstream TLS and no DestinationRule.
  The gateway<->BBR hop never leaves the pod network.
*/}}
{{- $anchor := include "modelharness.bbrAnchorFilter" . }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: bbr-ext-proc
  namespace: {{ include "modelharness.namespace" . }}
  labels:
    {{- include "modelharness.labels" . | nindent 4 }}
spec:
  priority: 5
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: {{ include "modelharness.gatewayName" . | quote }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              {{- with $anchor }}
              subFilter:
                name: {{ . | quote }}
              {{- end }}
      patch:
        operation: {{ ternary "INSERT_AFTER" "INSERT_FIRST" (ne $anchor "") }}
        value:
          name: envoy.filters.http.ext_proc.bbr
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            # Fail-closed (explicit). When the BBR ext_proc service is
            # unreachable, Envoy rejects the request with a local reply rather
            # than skipping BBR (which would drop the X-Gateway-Model-Name
            # header and fall through to the catch-all as a misleading 404).
            failure_mode_allow: false
            # Status returned downstream when the BBR ext_proc server errors,
            # fails to respond, or cannot be reached. Envoy's built-in ext_proc
            # default is 500, but we pin it explicitly to 503 Service
            # Unavailable: a BBR outage is a transient "dependency temporarily
            # down, retry" condition, which 503 expresses more accurately than
            # the generic 500. It also aligns with the ext_authz outage status
            # (also pinned to 503), so every fail-closed cluster-filter outage
            # surfaces a consistent 503 upstream of the gateway local_reply.
            # The local_reply (mapper #5) matches exactly this status with the
            # model header ABSENT and maps it to 502 bbr_unavailable
            # (x-kaito-error-source: bbr), so keep the two in sync. In
            # FULL_DUPLEX_STREAMED mode Envoy does not enforce the ext_proc
            # message timeout, so a hung BBR holds the request rather than
            # producing a separate 504 local reply.
            status_on_error:
              code: ServiceUnavailable
            allow_mode_override: true
            processing_mode:
              request_header_mode: {{ if .Values.bbr.supportedEvents.requestHeaders }}"SEND"{{ else }}"SKIP"{{ end }}
              response_header_mode: {{ if .Values.bbr.supportedEvents.responseHeaders }}"SEND"{{ else }}"SKIP"{{ end }}
              request_body_mode: {{ if .Values.bbr.supportedEvents.requestBody }}"FULL_DUPLEX_STREAMED"{{ else }}"NONE"{{ end }}
              response_body_mode: {{ if .Values.bbr.supportedEvents.responseBody }}"FULL_DUPLEX_STREAMED"{{ else }}"NONE"{{ end }}
              request_trailer_mode: {{ if .Values.bbr.supportedEvents.requestTrailers }}"SEND"{{ else }}"SKIP"{{ end }}
              response_trailer_mode: {{ if .Values.bbr.supportedEvents.responseTrailers }}"SEND"{{ else }}"SKIP"{{ end }}
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|{{ .Values.bbr.port }}||{{ .Values.bbr.name }}.{{ .Values.bbr.namespace }}.svc.cluster.local
    # Remove client-supplied routing headers immediately before BBR (see
    # "Client-supplied routing headers" above). INSERT_BEFORE anchors on the
    # BBR filter the previous patch inserts: Istio applies the patches of one
    # EnvoyFilter in order, so the anchor always exists.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.ext_proc.bbr"
      patch:
        operation: INSERT_BEFORE
        value:
          name: kaito.strip-routing-headers
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                local routing_headers = { "x-gateway-model-name", "x-gateway-base-model-name" }

                function envoy_on_request(request_handle)
                  local headers = request_handle:headers()
                  for _, name in ipairs(routing_headers) do
                    -- remove() also drops the cached route; get() keeps that
                    -- to the requests that carry the header.
                    if headers:get(name) ~= nil then
                      headers:remove(name)
                    end
                  end
                end
    # ─────────────────────────────────────────────────────────────────
    # Passive outlier detection for the BBR ext_proc upstream cluster.
    #
    # Istio auto-generates the
    # `outbound|{{ .Values.bbr.port }}||{{ .Values.bbr.name }}.{{ .Values.bbr.namespace }}.svc.cluster.local`
    # cluster the ext_proc filter dials. This CLUSTER patch MERGEs
    # `outlier_detection` onto it so a BBR replica that starts erroring is
    # ejected from the load-balancing set and in-flight requests fail over
    # to healthy replicas instead of tripping the fail-closed
    # `502 bbr_unavailable` path. The Kubernetes gRPC readiness probe is the
    # complementary ACTIVE health check.
    #
    # `max_ejection_percent` stays < 100 so outlier detection can never
    # eject every replica at once: `502 bbr_unavailable` only fires when ALL
    # replicas are genuinely unhealthy.
    #
    # Scoped to this namespace's Gateway pod via the workloadSelector above.
    # ─────────────────────────────────────────────────────────────────
    - applyTo: CLUSTER
      match:
        context: GATEWAY
        cluster:
          service: {{ .Values.bbr.name }}.{{ .Values.bbr.namespace }}.svc.cluster.local
          portNumber: {{ .Values.bbr.port }}
      patch:
        operation: MERGE
        value:
          outlier_detection:
            consecutive_gateway_failure: {{ .Values.bbr.outlierDetection.consecutiveGatewayFailure }}
            enforcing_consecutive_gateway_failure: 100
            consecutive_5xx: {{ .Values.bbr.outlierDetection.consecutive5xx }}
            enforcing_consecutive_5xx: 100
            # Treat ext_proc connect/stream failures (local-origin
            # errors) as eject-worthy, not just upstream 5xx.
            split_external_local_origin_errors: true
            consecutive_local_origin_failure: {{ .Values.bbr.outlierDetection.consecutiveGatewayFailure }}
            enforcing_consecutive_local_origin_failure: 100
            interval: {{ .Values.bbr.outlierDetection.interval | quote }}
            base_ejection_time: {{ .Values.bbr.outlierDetection.baseEjectionTime | quote }}
            max_ejection_percent: {{ .Values.bbr.outlierDetection.maxEjectionPercent }}
