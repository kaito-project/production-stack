# Per-namespace gateway error `local_reply`: the single place that rewrites
# Envoy-generated 5xx local replies into the unified OpenAI-compatible error
# envelope. This filter owns the WHOLE request path — the cluster-filter hops
# (ext_authz / BBR), the namespace Gateway dataplane, AND the modeldeployment
# EPP / upstream-inference hops — so every local reply with status >= 500 is
# mapped to exactly one `code` + `x-kaito-error-source` by a single,
# explicitly-ordered, first-match-wins mapper list. Consolidating the EPP
# mappers here (they used to live in a separate per-modeldeployment
# EnvoyFilter) removes the non-deterministic cross-EnvoyFilter merge order on
# the shared Gateway HCM.
#
# Component attribution model. Three orthogonal signals locate the at-fault
# hop:
#   * `X-Gateway-Model-Name` request header — injected by BBR, which runs
#     BEFORE route matching (EPP and the upstream run after). Header ABSENT =>
#     the failure is at/before BBR (infrastructure side: ext_authz, BBR, or the
#     namespace Gateway dataplane). Header PRESENT => BBR already ran and the
#     request was routed to a model (model-serving side: EPP or the inference
#     pods). This requires the gateway to strip any client-supplied
#     `X-Gateway-Model-Name` at ingress so it cannot be spoofed.
#   * Envoy response flag — a router/upstream flag (UH/LH/UT/UPE/UF/UC/NC)
#     means the routed upstream or the gateway dataplane failed; UAEX means
#     ext_authz. An ext_proc filter (BBR or EPP) never sets a response flag.
#   * Envoy response code details — Envoy prefixes the details of every local
#     reply it generates because an ext_proc call FAILED (server unreachable,
#     gRPC error, per-message timeout) with `ext_proc_error`. An ext_proc
#     server that is up and deliberately rejects the request with an
#     ImmediateResponse sets no such prefix. This separates "the EPP is down"
#     from "the EPP is up but has no endpoint to serve the request" WITHOUT
#     depending on which status code the EPP picks for the latter (the
#     llm-d EPP answers an empty pool with 503 today; any other 5xx it might
#     choose maps the same way). Matched with the CEL access-log filter
#     (`envoy.access_loggers.extension_filters.cel`) on
#     `response.code_details`.
#
# Envoy's `local_reply` mapper filter is an AccessLogFilter, which has
# `and_filter` / `or_filter` / `response_flag_filter` / `header_filter` but NO
# `not_filter`. "No router flag" therefore cannot be written directly; it is
# expressed by ORDERING — every flag-bearing mapper precedes the no-flag
# mappers, so a request that reaches mapper 4a, 4b or 5 provably carries no
# router flag. Mappers are evaluated top-to-bottom, first-match wins:
#
#   1.  ext_authz outage     - UAEX + status >= 500                          -> 502 ext_authz_unavailable (authz)
#   2.  inference pods       - model header PRESENT + router flag             -> 503 model_unavailable     (inferenceset)
#   3.  gateway dataplane    - model header ABSENT  + router flag             -> 502 gateway_unavailable   (gateway)
#   4a. EPP ext_proc outage  - model header PRESENT + ext_proc_error details  -> 502 epp_unavailable       (epp)
#   4b. EPP rejects request  - model header PRESENT + 5xx (no flag)           -> 503 model_unavailable     (inferenceset)
#   5.  BBR ext_proc outage  - model header ABSENT  + ext_proc_error details  -> 502 bbr_unavailable       (bbr)
#   6.  catch-all            - any remaining status >= 500                    -> gateway_internal_error    (gateway)
#
# Per-component `code`s are deliberately coarse: one code per at-fault
# component (plus a stable `x-kaito-error-source`). The fine-grained root cause
# (zero-replica warm-up vs crash vs OOM vs eviction vs scheduler bug vs
# provisioning failure) is NOT carried on the response — it is published as a
# control-plane Warning Event in kube-system by the status reporter. Returning
# more detail to the prompt client adds no actionable value: every sub-cause of
# a given component failure shares the same client behaviour (back off, retry).
#
# `workloadSelector` scopes the patch to this namespace's Gateway pod.
# `operation: MERGE` on the http_connection_manager merges `local_reply_config`
# without replacing the Istio-managed filter chain. Only Envoy-generated local
# replies are rewritten; responses proxied back from an upstream pod (e.g. a
# genuine vLLM 500, or a vLLM-native 429) are NOT local replies and are left
# unchanged — those carry `x-kaito-error-source: inferenceset` stamped by the
# modeldeployment HTTPRoute ResponseHeaderModifier instead.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-filter-outage-local-reply
  namespace: {{ include "modelharness.namespace" . }}
  labels:
    {{- include "modelharness.labels" . | nindent 4 }}
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: {{ include "modelharness.gatewayName" . | quote }}
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            local_reply_config:
              mappers:
                # 1. ext_authz outage -> 502 ext_authz_unavailable (authz).
                # UAEX fires on any ext_authz deny or error; the `>= 500` guard
                # leaves legitimate 401/403 denies untouched and only rewrites
                # the 5xx an ext_authz OUTAGE produces (the filter is pinned to
                # status_on_error 503, see envoyfilter-ext-authz.yaml). Placed
                # first so an ext_authz outage (which is always model-header
                # ABSENT, as ext_authz runs before BBR) is attributed to authz
                # rather than falling through to the catch-all (#6).
                - filter:
                    and_filter:
                      filters:
                        - response_flag_filter:
                            flags:
                              - UAEX
                        - status_code_filter:
                            comparison:
                              op: GE
                              value:
                                default_value: 500
                                runtime_key: productionstack_ext_authz_min_status
                  status_code: 502
                  body:
                    inline_string: |
                      {"error":{"type":"service_unavailable","code":"ext_authz_unavailable","message":"The authentication service is temporarily unavailable. Please retry.","param":null}}
                  headers_to_add:
                    - header:
                        key: x-kaito-error-source
                        value: authz
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: content-type
                        value: application/json
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                # 2. inference pods -> 503 model_unavailable (inferenceset).
                # Model header PRESENT (request was routed to a model) AND a
                # router/upstream flag fired: the routed inference upstream
                # failed. Covers zero ready endpoints (UH: warm-up / crash /
                # OOM / eviction, or the EPP picked a pod the gateway has not
                # yet received through EDS), upstream request timeout (UT),
                # upstream protocol error (UPE), and upstream connection
                # failures (UF/UC/NC). Root-cause-neutral by design — every
                # sub-cause shares the same client behaviour (back off on
                # Retry-After and retry); the operator root cause is a
                # kube-system Event. The zero-ready-endpoint case where the EPP
                # itself rejects the request (no router flag) is #4b.
                - filter:
                    and_filter:
                      filters:
                        - header_filter:
                            header:
                              name: X-Gateway-Model-Name
                              present_match: true
                        - response_flag_filter:
                            flags:
                              - UH
                              - LH
                              - UT
                              - UPE
                              - UF
                              - UC
                              - NC
                  status_code: 503
                  body:
                    inline_string: |
                      {"error":{"type":"service_unavailable","code":"model_unavailable","message":"The requested model is temporarily unavailable. Back off and retry; see Events in kube-system for the root cause.","param":null}}
                  headers_to_add:
                    - header:
                        key: x-kaito-error-source
                        value: inferenceset
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: content-type
                        value: application/json
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: retry-after
                        value: "10"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                # 3. gateway dataplane -> 502 gateway_unavailable (gateway).
                # Model header ABSENT (request never reached model routing) AND
                # a router/upstream flag fired: the namespace Gateway dataplane
                # itself could not forward — no healthy upstream (UH/LH) or the
                # listener/cluster is not yet programmed while the harness
                # converges (UF/UC/NC).
                - filter:
                    and_filter:
                      filters:
                        - header_filter:
                            header:
                              name: X-Gateway-Model-Name
                              present_match: true
                              invert_match: true
                        - response_flag_filter:
                            flags:
                              - UH
                              - LH
                              - UT
                              - UPE
                              - UF
                              - UC
                              - NC
                  status_code: 502
                  body:
                    inline_string: |
                      {"error":{"type":"service_unavailable","code":"gateway_unavailable","message":"The namespace gateway has no ready upstream; retry shortly.","param":null}}
                  headers_to_add:
                    - header:
                        key: x-kaito-error-source
                        value: gateway
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: content-type
                        value: application/json
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                # 4a. EPP ext_proc outage -> 502 epp_unavailable (epp).
                # Model header PRESENT and the local reply was generated by
                # Envoy because the EPP ext_proc call FAILED: the EPP
                # (InferencePool endpointPickerRef: FailClose) is unreachable,
                # returned a gRPC error, or timed out. Envoy marks every such
                # reply with `ext_proc_error` response code details; a router
                # flag never accompanies it, and every PRESENT + router-flag
                # case was already taken by #2 anyway. A genuine vLLM 5xx is a
                # proxied upstream response, NOT a local reply, so it never
                # reaches here.
                - filter:
                    and_filter:
                      filters:
                        - header_filter:
                            header:
                              name: X-Gateway-Model-Name
                              present_match: true
                        - status_code_filter:
                            comparison:
                              op: GE
                              value:
                                default_value: 500
                                runtime_key: productionstack_epp_min_status
                        - extension_filter:
                            name: envoy.access_loggers.extension_filters.cel
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.access_loggers.filters.cel.v3.ExpressionFilter
                              expression: "response.code_details.startsWith('ext_proc_error')"
                  status_code: 502
                  body:
                    inline_string: |
                      {"error":{"type":"service_unavailable","code":"epp_unavailable","message":"The endpoint picker is temporarily unavailable. Please retry.","param":null}}
                  headers_to_add:
                    - header:
                        key: x-kaito-error-source
                        value: epp
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: content-type
                        value: application/json
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                # 4b. EPP rejects the request -> 503 model_unavailable
                # (inferenceset). Model header PRESENT, no router flag, and NOT
                # an Envoy ext_proc failure (#4a): the EPP is up and answered
                # with an ImmediateResponse 5xx because it cannot place the
                # request — no ready endpoint (warm-up / crash / OOM /
                # eviction / scaled to zero) or a scale-from-zero queue wait
                # that expired. The status the EPP picks is deliberately NOT
                # matched (llm-d answers 503 today), so a future change of
                # that code keeps the same attribution. Same envelope,
                # Retry-After and source as #2.
                - filter:
                    and_filter:
                      filters:
                        - header_filter:
                            header:
                              name: X-Gateway-Model-Name
                              present_match: true
                        - status_code_filter:
                            comparison:
                              op: GE
                              value:
                                default_value: 500
                                runtime_key: productionstack_epp_reject_min_status
                  status_code: 503
                  body:
                    inline_string: |
                      {"error":{"type":"service_unavailable","code":"model_unavailable","message":"The requested model is temporarily unavailable. Back off and retry; see Events in kube-system for the root cause.","param":null}}
                  headers_to_add:
                    - header:
                        key: x-kaito-error-source
                        value: inferenceset
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: content-type
                        value: application/json
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: retry-after
                        value: "10"
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                # 5. BBR ext_proc outage -> 502 bbr_unavailable (bbr).
                # Model header ABSENT and the local reply was generated by
                # Envoy because the BBR ext_proc call FAILED before BBR could
                # inject X-Gateway-Model-Name (`ext_proc_error` details; the
                # filter is pinned to status_on_error 503, see
                # envoyfilter-bbr.yaml). BBR itself only ever rejects with a
                # 400 (body is not JSON), so requiring the details prefix loses
                # no BBR outage, and keeps any other unflagged header-absent
                # 5xx from being blamed on BBR — those fall through to #6.
                - filter:
                    and_filter:
                      filters:
                        - header_filter:
                            header:
                              name: X-Gateway-Model-Name
                              present_match: true
                              invert_match: true
                        - status_code_filter:
                            comparison:
                              op: GE
                              value:
                                default_value: 500
                                runtime_key: productionstack_bbr_min_status
                        - extension_filter:
                            name: envoy.access_loggers.extension_filters.cel
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.access_loggers.filters.cel.v3.ExpressionFilter
                              expression: "response.code_details.startsWith('ext_proc_error')"
                  status_code: 502
                  body:
                    inline_string: |
                      {"error":{"type":"service_unavailable","code":"bbr_unavailable","message":"The request router is temporarily unavailable. Please retry.","param":null}}
                  headers_to_add:
                    - header:
                        key: x-kaito-error-source
                        value: bbr
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: content-type
                        value: application/json
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                # 6. Catch-all: any remaining local 5xx -> gateway_internal_error
                # (gateway). Placed last so the specific mappers above keep their
                # codes. `status_code` is omitted so the original 5xx status is
                # preserved; only the body and source header are normalized.
                - filter:
                    status_code_filter:
                      comparison:
                        op: GE
                        value:
                          default_value: 500
                          runtime_key: productionstack_gateway_min_status
                  body:
                    inline_string: |
                      {"error":{"type":"service_unavailable","code":"gateway_internal_error","message":"The namespace gateway encountered an unexpected error. Please retry.","param":null}}
                  headers_to_add:
                    - header:
                        key: content-type
                        value: application/json
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                    - header:
                        key: x-kaito-error-source
                        value: gateway
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
