{{- if eq .Values.cloudprovider "azure" }}
{{- if not .Values.azure.defaultDomain.zoneName }}
{{- fail "cloudprovider=\"azure\" requires azure.defaultDomain.zoneName. Fetch with: az aks show -g $RG -n $CLUSTER --query 'ingressProfile.webAppRouting.defaultDomain.domainName' -o tsv" }}
{{- end }}
# Gateway with an Azure App-Routing default-domain HTTP listener.
# Rendered only when `cloudprovider=azure`; the non-Azure sibling
# `templates/gateway.yaml` (HTTP only) renders otherwise. Kept as a
# separate file (rather than an inline conditional in the shared
# Gateway spec) so the two variants can evolve independently and it's
# obvious at a glance which cloud a given cluster is running.
#
# E2E reaches this listener through a local Service port-forward, so it
# does not depend on public DNS or expose test credentials on the public
# LoadBalancer. Production TLS requires the App Routing Key Vault and
# Workload Identity integration and is intentionally outside this chart.
#
# Hostname on the HTTP listener is composed as
# `<workload-namespace>.<zoneName>` so every modelharness release
# gets a unique subdomain that the App-Routing operator's
# `default-domain-dns` ClusterExternalDNS auto-publishes into the
# aksapp.io zone.
#
# `gatewayClassName` MUST be `approuting-istio`; the Istio service-mesh
# add-on's `istio` GatewayClass is a different AKS integration.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "modelharness.gatewayName" . | quote }}
  namespace: {{ include "modelharness.namespace" . }}
  labels:
    {{- include "modelharness.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: {{ .Values.azure.defaultDomain.listenerName | quote }}
      port: {{ .Values.gatewayPort }}
      protocol: HTTP
      hostname: {{ printf "%s.%s" (include "modelharness.namespace" .) (.Values.azure.defaultDomain.zoneName | trimPrefix ".") | quote }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
