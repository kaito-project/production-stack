apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: e2e-preserve-istiod-inference-extension
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: app-routing-config
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.metadata.namespace != {{ .Release.Namespace | quote }} ||
        object.metadata.name != 'istiod' ||
        object.spec.template.spec.containers.exists(c,
          c.name == 'discovery' &&
          c.env.exists(e,
            e.name == 'ENABLE_GATEWAY_API_INFERENCE_EXTENSION' &&
            e.value == 'true'))
      message: The E2E App Routing istiod must keep Gateway API Inference Extension enabled
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: e2e-preserve-istiod-inference-extension
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: app-routing-config
spec:
  policyName: e2e-preserve-istiod-inference-extension
  validationActions: [Deny]