apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-app-routing-istio-extension-reader
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: app-routing-config
rules:
  # istiod starts informers for every served Istio CRD, not only resources
  # currently created by workload charts. The full CRD bundle installed by
  # setup-cluster.sh therefore requires read access across all four groups.
  - apiGroups:
      - networking.istio.io
      - security.istio.io
      - extensions.istio.io
      - telemetry.istio.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-app-routing-istio-extension-reader
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: app-routing-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: e2e-app-routing-istio-extension-reader
subjects:
  - kind: ServiceAccount
    name: istiod
    namespace: {{ .Release.Namespace }}