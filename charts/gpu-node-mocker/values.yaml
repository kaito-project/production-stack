# Install namespace for namespaced resources (Deployment, ServiceAccount,
# RoleBinding subject). Empty string ⇒ inherit the Helm release namespace
# (standard Helm behavior). Used when consumed as a subchart of the
# productionstack umbrella so the mocker can live in a dedicated namespace
# (e.g. kaito-system) independent of the umbrella release namespace.
namespaceOverride: ""

image:
  # REQUIRED: set via --set image.repository=<your-acr>.azurecr.io/gpu-node-mocker
  repository: "ghcr.io/kaito-project/gpu-node-mocker"
  tag: 0.4.1
  pullPolicy: IfNotPresent

shadowPod:
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
  # Latency knobs are resolved per-InferenceSet from a latency profile. By
  # default the profile is auto-selected from the served model size
  # (<5B ⇒ small-l40s, 5–25B ⇒ 8b-h100, ≥25B ⇒ 70b-tp8; see
  # llm-d-inference-sim/manifests/latency-profiles). An InferenceSet can override
  # the profile and calculator via pod-template annotations:
  #   kaito.sh/latency-profile: auto | small-l40s | 8b-h100 | 70b-tp8
  #   kaito.sh/latency-calculator: per-token | constant
  #
  # The values below are OPERATOR-WIDE DEFAULTS: set one to provide the baseline
  # for that knob. The selected latency profile OVERRIDES a default whenever the
  # profile defines that knob; a default only applies when the profile leaves it
  # empty. Leave a value empty ("") to have no default and rely solely on the
  # profile (recommended).
  timeToFirstToken: ""
  interTokenLatency: ""
  timeToFirstTokenStdDev: ""
  interTokenLatencyStdDev: ""
  kvCacheTransferLatency: ""
  kvCacheTransferLatencyStdDev: ""
  timeFactorUnderLoad: ""
  # latencyCalculator is the operator-wide default calculator ("per-token" or
  # "constant") used when a pod has no kaito.sh/latency-calculator annotation.
  # Empty ⇒ "per-token".
  latencyCalculator: ""
  prefillOverhead: ""
  prefillTimePerToken: ""
  prefillTimeStdDev: ""
  kvCacheTransferTimePerToken: ""
  kvCacheTransferTimeStdDev: ""

  # streamingProbe validates the KAITO model-streaming path on CPU before the
  # simulator starts. When the original inference pod is a streaming pod, the
  # shadow pod clones its streaming identity, re-runs the credential bootstrap,
  # lists the model's safetensors and streams a shard into CPU memory.
  # A failure keeps the shadow pod from becoming Ready, which keeps the mocked
  # inference pod Pending — so "mock serving is Ready" also means "streaming is
  # validated".
  #
  # There is no switch to skip the probe: a pod that streams is a pod whose
  # streaming should be verified. To opt out, disable streaming on the model
  # itself (modeldeployment `streaming.disabled`), so KAITO renders a
  # non-streaming pod and there is nothing to probe.
  #
  # Requires Azure Workload Identity on the cluster: the probe relies on the
  # azure-workload-identity mutating webhook to inject the AAD env vars and
  # projected SA token into the shadow pod.
  streamingProbe:
    image: python:3.12-slim
    timeoutSeconds: 600
    resources:
      cpu: "1"
      # Memory limit. The controller pins the request lower so shadow pods stay
      # schedulable. Sized for the small model the mocker is paired with; it
      # mostly covers torch's resident footprint on the direct-azure path. The
      # SAS path installs nothing and needs far less.
      memory: 1Gi
    # RUNAI_STREAMER_MEMORY_LIMIT in bytes. 0 selects the streamer's
    # largest_chunk mode, sizing its CPU buffer to exactly the largest tensor in
    # the shard being read — the minimum that can work, computed per model. A
    # positive value is both a cap and the allocation size, and the streamer
    # refuses to run when it falls below that tensor.
    streamerMemoryLimitBytes: 0

# nodeProvisioner selects which KAITO node provisioner to mock.
# Must match KAITO's --node-provisioner value: azure-gpu-provisioner or karpenter.
nodeProvisioner: karpenter

# cloudProvider selects the KAITO SKU catalog used to size each fake node's
# nvidia.com/gpu capacity. Valid values: "azure", "aws", "arc". Set to "" to
# disable the lookup and advertise 1 GPU on every fake node regardless of the
# NodeClaim's node.kubernetes.io/instance-type requirement.
cloudProvider: azure

# nodeClass selects the karpenter NodeClass kind the mocker reconciles (and
# discovery-checks at startup) in karpenter mode. The default mock node class
# lives in the karpenter.kaito.sh group, which a real Karpenter provider does
# NOT recognize — so a KAITO NodePool referencing it is ignored by real
# karpenter and handled only by gpu-node-mocker. Point KAITO's
# karpenterProviders.<provider> group/kind/version/resourceName at the SAME
# values so its NodePool nodeClassRef and the NodeClass objects it creates
# match what the mocker watches. Set to the karpenter.azure.com AKSNodeClass
# values to mock the real Azure node class instead.
nodeClass:
  group: karpenter.kaito.sh
  version: v1alpha1
  kind: MockNodeClass
  resource: mocknodeclasses

leaseDurationSeconds: 40
leaseRenewIntervalSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# tolerations applied to the controller pod. Empty by default; the caller is
# expected to pass any required tolerations (e.g. a CriticalAddonsOnly
# toleration for nodes reserved for critical add-ons).
tolerations: []
