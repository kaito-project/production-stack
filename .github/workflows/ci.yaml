name: Lint, test & build (push / PR)

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch: {}

env:
  GO_VERSION: '1.26.9'

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check spelling with custom config file
        uses: crate-ci/typos@v1.44.0
        with:
          config: ./.github/typos.toml
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir . --verbose --no-progress '**/*.md'
          fail: false
      - name: Verify Mod
        run: make verify-mod
      - name: Verify Manifests
        run: make verify-manifests
      - name: Verify Boilerplate
        run: make verify-boilerplate
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Lint golang code
        run: make lint

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run Tests
        run: make test
      - name: Build gpu-node-mocker binary
        run: make build ARCH=${{ matrix.arch }}
      - name: Build productionstack-status-reporter binary
        run: make build-status-reporter ARCH=${{ matrix.arch }}

  kaito-guard-ext-proc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ext_proc and test dependencies
        working-directory: kaito-guard-ext-proc
        run: python -m pip install -e '.[dev]'
      - name: Run ext_proc tests
        working-directory: kaito-guard-ext-proc
        run: python -m pytest
      - name: Build ext_proc image
        run: docker build -f docker/Dockerfile.kaito-guard-ext-proc -t kaito-guard-ext-proc:ci .

  docker-build:
    runs-on: ubuntu-latest
    needs: [check-files, golangci-lint, build-and-test]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build docker image (linux/${{ matrix.arch }})
        run: make docker-build ARCH=${{ matrix.arch }}
      - name: Build status reporter image (linux/${{ matrix.arch }})
        run: make docker-build-status-reporter ARCH=${{ matrix.arch }}
