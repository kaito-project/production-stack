name: E2E tests (PR)

on:
  # Every PR gets the e2e-tests check that main requires; the changes job
  # decides whether the suite actually runs.
  # No push-to-main trigger: PRs already gate the merge and e2e-nightly.yaml
  # runs the full suite on main daily, so post-merge breakage is caught there.
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or ref to run E2E tests against, e.g. main, or refs/pull/<number>/merge for a PR'
        required: true
        default: 'main'
      provider:
        description: 'E2E provider — "azure" uses managed KEDA and App Routing; "upstream" uses Helm KEDA and Istio.'
        required: false
        default: 'azure'
        type: choice
        options:
          - upstream
          - azure
      istio_version:
        description: 'Istio version (e.g. 1.29.0). Leave empty to use default from versions.env'
        required: false
        default: ''
      gateway_api_version:
        description: 'Gateway API CRD version (e.g. v1.2.0). Leave empty to use default from versions.env'
        required: false
        default: ''
      keda_version:
        description: 'KEDA Helm chart version (e.g. v2.19.0). Leave empty to use default from versions.env'
        required: false
        default: ''
      node_class:
        description: 'Karpenter NodeClass: "mock" (gpu-node-mocker MockNodeClass) or "azure" (real AKSNodeClass).'
        required: false
        default: 'mock'
        type: choice
        options:
          - mock
          - azure

env:
  # github.run_attempt is appended so retried runs ("Re-run failed jobs")
  # don't collide with leftover resources from the previous attempt.
  RESOURCE_GROUP: "kaito-gw-e2e-rg-${{ github.run_id }}-${{ github.run_attempt }}"
  CLUSTER_NAME: "kaito-gw-e2e-aks-${{ github.run_id }}-${{ github.run_attempt }}"
  ACR_NAME: "kaitogwe2eaks${{ github.run_id }}a${{ github.run_attempt }}acr"
  GPU_MOCKER_IMAGE: "gpu-node-mocker:latest-${{ github.run_id }}-${{ github.run_attempt }}"
  # westus2: closest region to the self-hosted runner (westus, which does not
  # offer Standard_D8s_v5) with standardDSv5Family quota to spare; the
  # australiaeast quota is shared with other workflows and dev clusters, and
  # westus3 rejected cluster creation with AKSCapacityHeavyUsage.
  LOCATION: westus2
  NODE_COUNT: '3'
  NODE_VM_SIZE: Standard_D8s_v5

permissions:
  contents: read

jobs:
  # Only run E2E when a change can actually affect cluster behaviour
  # (controllers, charts, images, the e2e suite or its setup / build inputs).
  # Docs-only or otherwise unrelated changes, including a change to this
  # workflow alone, skip e2e-tests, so the singleton self-hosted E2E runner
  # isn't spent on PRs that can't change the outcome. To run the suite for such
  # a PR anyway, dispatch this workflow with branch refs/pull/<number>/merge.
  # This can't be a paths filter on the trigger: a workflow it skips reports
  # no check, so a PR outside the paths could never merge. A job skipped by
  # its `if` reports a passing check.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changes the suite can catch
        id: diff
        # HEAD is the PR's merge commit and HEAD^1 the base branch it merges
        # into. A git error counts as a change, so the suite runs.
        run: |
          if git diff --quiet HEAD^1 HEAD -- \
              cmd pkg charts docker test hack/e2e \
              go.mod go.sum Makefile versions.env \
              .github/actions/e2e-base-setup; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-tests:
    needs: changes
    # changes is skipped on workflow_dispatch, and if it fails the suite runs
    # instead of the check passing unverified.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: [ "self-hosted", "hostname:kaito-e2e-github-runner" ]
    environment: e2e-test
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: E2E base setup
        uses: ./.github/actions/e2e-base-setup
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          acr-name: ${{ env.ACR_NAME }}
          gpu-mocker-image: ${{ env.GPU_MOCKER_IMAGE }}
          location: ${{ env.LOCATION }}
          node-count: ${{ env.NODE_COUNT }}
          node-vm-size: ${{ env.NODE_VM_SIZE }}
          provider: ${{ github.event.inputs.provider }}
          istio-version: ${{ github.event.inputs.istio_version }}
          gateway-api-version: ${{ github.event.inputs.gateway_api_version }}
          keda-version: ${{ github.event.inputs.keda_version }}
          node-class: ${{ github.event.inputs.node_class }}

      - name: Run E2E tests
        # Slow Nightly, Perf, and Scaling specs run in their dedicated workflows.
        run: make test-e2e
        env:
          E2E_LABEL: "!Nightly && !Perf && !Scaling"
          # The suite runs ~55-60 min on 2 workers (randomized order puts
          # Serial specs anywhere), so the Makefile's 60m default leaves no
          # headroom; a suite timeout aborts whatever spec is running.
          E2E_TIMEOUT: 90m

      - name: Generate E2E coverage report
        if: always()
        run: |
          go run ./hack/e2e/report \
            --label-filter '!Nightly && !Perf && !Scaling' \
            --workflow 'E2E tests' \
            --results ginkgo-report.json \
            --output-md e2e-coverage-report.md \
            --output-html e2e-coverage-report.html
          cat e2e-coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-report
          path: |
            e2e-coverage-report.md
            e2e-coverage-report.html

      - name: Dump cluster state
        if: failure()
        run: make e2e-dump

      - name: Teardown cluster
        if: always()
        run: make e2e-teardown
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
